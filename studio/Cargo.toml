[workspace]
resolver = "3"
members = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gooey-audio/3d"

[profile.release]
lto = "thin"

# Debug builds: optimize dependencies (Manifold, wgpu) so validation stays fast.
[profile.dev.package."*"]
opt-level = 3
