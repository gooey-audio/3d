[package]
name = "gooey-studio"
description = "gooey-studio: a local web app for Replicad part scripts with an AI agent, a three.js preview and path-traced contact sheets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gooey-studio"
path = "src/main.rs"

[dependencies]
gooey-cad = { path = "../../engine/crates/cad" }
gooey-render = { path = "../../engine/crates/render" }
anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
mime_guess = "2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
