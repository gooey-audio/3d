name: release

# Tag vX.Y.Z: CLI binaries (with the gooey-cad-worker executable) and the wasm package as release assets.
# Consumers pin by URL (speakers: the gooey-3d CLI; waveopt: the wasm tarball in package.json).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        include:
          # `bun`: the cad-worker target; `smoke`: the runner can execute the archive.
          - { os: macos-15, target: aarch64-apple-darwin, bun: bun-darwin-arm64, smoke: true }
          - { os: macos-15, target: x86_64-apple-darwin, bun: bun-darwin-x64, env: "CMAKE_OSX_ARCHITECTURES=x86_64" }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bun: bun-linux-x64, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: build
        run: env ${{ matrix.env }} cargo build --release -p gooey-3d --target ${{ matrix.target }}
      # The worker bundles LGPL OpenCascade WASM: ship THIRD_PARTY_LICENSES plus the
      # npm packages' licence texts; sources and build script stay in cad-worker/.
      - name: build the CAD worker
        run: cad-worker/build.sh ${{ matrix.bun }}
      - name: package
        run: |
          name=gooey-3d-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/gooey-3d README.md LICENSE-MIT LICENSE-APACHE "$name/"
          bun=${{ matrix.bun }}
          cp "cad-worker/dist/gooey-cad-worker-${bun#bun-}" "$name/gooey-cad-worker"
          {
            cat THIRD_PARTY_LICENSES
            for p in replicad-opencascadejs replicad opentype.js flatbush flatqueue manifold-3d; do
              printf '\n\n==== %s %s ====\n\n' "$p" "$(jq -r .version "cad-worker/node_modules/$p/package.json")"
              cat "cad-worker/node_modules/$p/LICENSE"
            done
          } > "$name/THIRD_PARTY_LICENSES"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: smoke test (archive only, no Node or Bun on PATH)
        if: matrix.smoke
        run: |
          dir=gooey-3d-${GITHUB_REF_NAME}-${{ matrix.target }}
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$dir/gooey-3d" cad check fixtures/cad/brace.js
      - uses: softprops/action-gh-release@v2
        with:
          files: gooey-3d-*.tar.gz*

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/llvm20
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-wasm.sh target/pkg
      - run: node crates/castkit-wasm/tests/node.mjs target/pkg fixtures
      - name: package
        run: |
          cd target/pkg && npm pack && mv castkit-wasm-*.tgz ../../castkit-wasm-${GITHUB_REF_NAME}.tgz
          cd ../.. && shasum -a 256 castkit-wasm-*.tgz > castkit-wasm-${GITHUB_REF_NAME}.tgz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: castkit-wasm-*.tgz*
