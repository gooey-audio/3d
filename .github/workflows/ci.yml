name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GPU tests skip themselves without an adapter; `gpu::` is skipped outright because
      # hosted runners have no GPU (or only a paravirtual one).
      - run: cargo test --release --workspace -- --skip 'gpu::'
      - run: cargo build --release -p gooey-3d
      - name: mould build --check on every fixture
        run: |
          for spec in fixtures/*/spec.json; do
            target/release/gooey-3d mould build "$spec" --check
          done
      - name: STL bytes against the committed hashes (recorded, not enforced yet)
        run: |
          for spec in fixtures/*/spec.json; do
            target/release/gooey-3d mould build "$spec" --check --strict || echo "::warning::$spec: STL bytes differ on ${{ matrix.os }}"
          done
      - name: render check (fixture renders match their inputs; no GPU)
        working-directory: fixtures/render
        run: ../../target/release/gooey-3d render check
      - name: render bounds and materials run without a GPU
        working-directory: fixtures/render
        run: |
          ../../target/release/gooey-3d render bounds assembly.json --explode 1 > /dev/null
          ../../target/release/gooey-3d render materials --json > /dev/null

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # castkit-core and castkit-wasm keep 1.85; gooey-render and gooey-3d need 1.88 (wgpu, let-chains).
      - run: cargo check -p castkit-core -p castkit-wasm

  msrv-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p gooey-render -p gooey-3d

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/llvm20
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-wasm.sh target/pkg
      - run: node crates/castkit-wasm/tests/node.mjs target/pkg fixtures
      - run: ls -l target/pkg
