name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # GPU tests skip themselves without an adapter; `gpu::` is skipped outright because
      # hosted runners have no GPU (or only a paravirtual one).
      - run: cargo test --release --workspace -- --skip 'gpu::'
      - name: Modal shim and remote-render client compile (syntax only; no Modal here)
        run: python3 -m py_compile modal/gooey_render.py scripts/remote-render
      - run: cargo build --release -p gooey-3d
      - name: mould build --check on every fixture
        run: |
          for spec in fixtures/*/spec.json; do
            target/release/gooey-3d mould build "$spec" --check
          done
      - name: STL bytes against the committed hashes (recorded, not enforced yet)
        run: |
          for spec in fixtures/*/spec.json; do
            target/release/gooey-3d mould build "$spec" --check --strict || echo "::warning::$spec: STL bytes differ on ${{ matrix.os }}"
          done
      - name: render check (fixture renders match their inputs; no GPU)
        working-directory: engine/fixtures/render
        run: ../../target/release/gooey-3d render check
      - name: render bounds and materials run without a GPU
        working-directory: engine/fixtures/render
        run: |
          ../../target/release/gooey-3d render bounds assembly.json --explode 1 > /dev/null
          ../../target/release/gooey-3d render materials --json > /dev/null

  # `gooey-3d cad`: build the Bun worker for the runner, then run the cad tests
  # (they skip themselves in `native`, which has no worker).
  cad:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: build the worker (host target -> cad-worker/dist/gooey-cad-worker)
        run: cad-worker/build.sh
      - name: typecheck the worker
        working-directory: engine/cad-worker
        run: bunx tsc --noEmit
      - name: cad tests (compiled worker)
        run: cargo test --release -p gooey-cad -p gooey-3d
      - name: brace builds with the compiled worker next to gooey-3d, no Node or Bun on PATH
        run: |
          cp cad-worker/dist/gooey-cad-worker target/release/
          env -i HOME="$HOME" PATH=/usr/bin:/bin target/release/gooey-3d cad build fixtures/cad/brace.js --out target/cad/brace
          jq -e '.closed and .pieces == 1 and .genus == 4 and .volume_mm3 > 37595 and .volume_mm3 < 37671' target/cad/brace/report.json

  msrv:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # castkit-core and castkit-wasm keep 1.85; gooey-render, gooey-cad and gooey-3d need 1.88 (wgpu, let-chains).
      - run: cargo check -p castkit-core -p castkit-wasm

  msrv-render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo check -p gooey-render -p gooey-cad -p gooey-3d
      # The render-only build (Modal) needs neither cmake nor bun.
      - run: cargo check -p gooey-3d --no-default-features --features render

  wasm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: ./.github/actions/llvm20
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-wasm.sh target/pkg
      - run: node crates/castkit-wasm/tests/node.mjs target/pkg fixtures
      - run: ls -l target/pkg

  # gooey-studio: the web UI (typecheck + build) and the server's tests, with the CAD
  # worker so the build test runs too.
  studio:
    runs-on: macos-15
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: web UI
        working-directory: studio/web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: build the CAD worker
        run: ../engine/cad-worker/build.sh
      - run: cargo test --release
