[package]
name = "gooey-3d"
description = "gooey-3d: casting moulds (castkit) and path-traced renders from one CLI"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[[bin]]
name = "gooey-3d"
path = "src/main.rs"

[features]
default = ["mould", "render"]
# `gooey-3d mould …`: needs cmake and a C++ compiler (Manifold).
mould = ["dep:castkit-core"]
# `gooey-3d render …`: wgpu path tracer.
render = ["dep:gooey-render"]
parallel = ["castkit-core?/parallel"]

[dependencies]
castkit-core = { workspace = true, optional = true }
gooey-render = { workspace = true, optional = true }
serde_json.workspace = true
